name: Apply Ares productization patch

on:
  push:
    branches:
      - productize/ares-1.1.0
    paths:
      - scripts/apply_productization.py
      - .github/workflows/productize-apply.yml

permissions:
  contents: write

concurrency:
  group: productize-ares-1-1
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.repository == 'jason-allen-oneal/Ares'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out productization branch
        uses: actions/checkout@v7
        with:
          ref: productize/ares-1.1.0
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply one-shot source patch
        run: python scripts/apply_productization.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,anthropic,gemini,ghostmcp]' -e vendor/ghostmcp

      - name: Run tests and compile gate
        run: |
          python -m pytest tests -q
          python -m compileall -q src/ares

      - name: Build and validate product distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name 'bluedot_ares-1.1.0-py3-none-any.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'bluedot_ares-1.1.0.tar.gz' -print -quit)"

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/ares-product-smoke
          . /tmp/ares-product-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          test "$(ares --version)" = "1.1.0"
          ares doctor --json | python -m json.tool >/dev/null
          ares support-bundle --out /tmp/ares-support-bundle.json
          python -m json.tool /tmp/ares-support-bundle.json >/dev/null
          ares mission run --help | grep -F -- '--approval-receipts'
          python -c "import importlib.metadata as m; assert m.version('bluedot-ares') == '1.1.0'"

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: productize Ares 1.1.0"
          git push origin HEAD:productize/ares-1.1.0
